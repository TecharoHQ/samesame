name: Docker

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  # semantic-release tags releases with GITHUB_TOKEN, and GitHub does not
  # start workflows for events made with that token, so a tag trigger would
  # never fire. Build release images when the Release workflow finishes.
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/techarohq/samesame

jobs:
  image:
    name: Build and push
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # The Go toolchain stamps the version from git tags, so fetch them.
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_run' && 'main' || '' }}
          persist-credentials: false

      # After a release, build the tag semantic-release just created.
      - name: Find release tag
        id: release
        if: github.event_name == 'workflow_run'
        run: |
          tag="$(git describe --tags --abbrev=0)"
          git checkout --quiet "$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern=v{{version}},value=${{ steps.release.outputs.tag }},enable=${{ steps.release.outputs.tag != '' }}
            type=semver,pattern=v{{major}}.{{minor}},value=${{ steps.release.outputs.tag }},enable=${{ steps.release.outputs.tag != '' }}
            type=raw,value=latest,enable=${{ steps.release.outputs.tag != '' }}
            type=sha
          flavor: |
            latest=false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/bake-action@v7
        with:
          # Build from the checkout, not a git context: the version stamp
          # needs .git and the release tag checked out above.
          source: .
          files: |
            ./docker-bake.hcl
            cwd://${{ steps.meta.outputs.bake-file }}
          targets: samesame
          push: ${{ github.event_name != 'pull_request' }}
          set: |
            *.cache-from=type=gha
            *.cache-to=type=gha,mode=max
